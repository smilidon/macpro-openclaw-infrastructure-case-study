# Graft Workflow
# Handles automated dependency updates, branch management, and smart merging

name: Graft
on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  workflow_dispatch:
    inputs:
      update-type:
        description: 'Type of updates to apply'
        required: true
        type: choice
        options:
          - dependencies
          - security
          - all
        default: 'security'

permissions:
  contents: write
  pull-requests: write

jobs:
  graft-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.update-type != 'security' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools

      - name: Check for requirements files
        id: req-files
        run: |
          files=()
          for f in requirements*.txt setup.py pyproject.toml; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_reqs=false" >> $GITHUB_OUTPUT
          else
            echo "has_reqs=true" >> $GITHUB_OUTPUT
            echo "files=${files[*]}" >> $GITHUB_OUTPUT
          fi

      - name: Update Python dependencies
        if: ${{ steps.req-files.outputs.has_reqs == 'true' }}
        run: |
          # Check if pip-compile can be used
          if [ -f "requirements.in" ] || [ -f "requirements.txt" ]; then
            # Update with pip-compile if available
            pip-compile --upgrade requirements.txt 2>/dev/null || true
          fi
          
          # Also check for pyproject.toml with dynamic deps
          if [ -f "pyproject.toml" ]; then
            # Could add pip-compile for pyproject.toml here
            echo "pyproject.toml found - manual review recommended for dependency updates"
          fi

      - name: Create PR for dependency updates
        if: ${{ steps.req-files.outputs.has_reqs == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dependencies"
          title: "chore: automated dependency updates"
          body: |
            This PR contains automated dependency updates.
            
            Please review the changes and run tests before merging.
          branch: graft/dependencies-${{ github.run_id }}
          delete-branch: true

  graft-security:
    name: Security Updates
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.update-type == 'security' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run security audit (Python)
        run: |
          pip install pip-audit
          pip-audit --desc=on --fix 2>/dev/null || echo "Security audit completed"

      - name: Run npm audit if package.json exists
        if: always()
        run: |
          if [ -f "package.json" ]; then
            npm audit fix 2>/dev/null || echo "npm audit completed"
          fi

      - name: Create PR for security fixes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: automated security fixes"
          title: "security: automated security fixes"
          body: |
            This PR contains automated security fixes from dependency audits.
            
            Please review the changes and run tests before merging.
          branch: graft/security-${{ github.run_id }}
          delete-branch: true

  graft-branch-sync:
    name: Sync Upstream Branches
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          UPSTREAM_URL=$(gh repo view --json parent --jq '.parent.url')
          if [ -n "$UPSTREAM_URL" ] && [ "$UPSTREAM_URL" != "null" ]; then
            git remote add upstream "$UPSTREAM_URL"
            echo "upstream_added=true" >> $GITHUB_OUTPUT
          else
            echo "upstream_added=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync with upstream
        if: ${{ steps.add-upstream.outputs.upstream_added == 'true' }}
        run: |
          git fetch upstream
          # Update main branch from upstream
          git checkout main
          git merge upstream/main --no-edit || echo "Merge conflicts - manual resolution needed"
          git push origin main