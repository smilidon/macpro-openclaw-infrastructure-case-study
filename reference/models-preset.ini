; Thumbo local models for llama-server router mode (2x FirePro D700, Vulkan). Created 2026-11-21.
; Tuned from benchmarks in ~/models/bench-results/. Start/stop: systemctl --user {start|stop} llama-router
version = 1

[*]
; both GPUs, even layer split, everything on GPU; FA off was faster on these GCN1 cards
dev = Vulkan0,Vulkan1
sm = layer
ts = 1,1
ngl = 99
fa = off
; small prompt chunks: large ones caused GPU ring timeouts in August
b = 512
ub = 256
np = 1
t = 12
jinja = true

[gemma-e4b]
; Gemma 4 E4B abliterix + vision encoder: default local model (text + images), ~5.9 tok/s
model = /path/to/models/gemma-4-E4B-it-abliterix.Q4_K_M.gguf
mmproj = /path/to/models/mmproj-gemma-4-E4B-F16.gguf
c = 32768
temp = 1.0
top-k = 64
top-p = 0.95
reasoning = off
load-on-startup = true

[qwen35-9b-abliterated]
; bigger/smarter text-only model, slower (~4.2 tok/s); swapped in on demand
model = /path/to/models/Qwen3.5-9B-abliterated-Q4_K_M.gguf
c = 65536
fa = on
ctk = q8_0
ctv = q8_0
reasoning = off

[embed]
; EmbeddingGemma 300M for memory search; CPU only so it can stay loaded beside a chat model
model = /path/to/models/embeddinggemma-300M-Q8_0.gguf
dev = none
ngl = 0
embedding = true
c = 2048
; CPU only, so a full-context batch is safe (memory chunks are up to ~500 tokens)
b = 2048
ub = 2048
load-on-startup = true

[lfm3-1.7b]
; LiquidAI LFM3 1.7B: CPU-only last-resort/offline text model built for tools and agents (~25 tok/s on CPU).
; Always loaded; needs no GPU, so it answers even while image/video jobs hold the cards.
model = /path/to/models/LFM3-1.7B-Q4_K_M.gguf
dev = none
ngl = 0
c = 32768
b = 2048
ub = 512
load-on-startup = true
